<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kiln live</title>
<style>
  :root { --bg: #14131b; --panel: #1c1a26; --panel2: #25222f; --line: #322d40; --text: #e8e4f0; --dim: #9a93ab;
    --accent: #ff9b5a; --bad: #ff6b7a; --ok: #7bd88f; --mono: ui-monospace, "Cascadia Code", "SF Mono", Consolas, monospace; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, sans-serif; }
  body { display: grid; grid-template: "head head head" 44px "list main side" 1fr / 230px 1fr 280px; }
  header { grid-area: head; display: flex; align-items: center; gap: 14px; padding: 0 14px; background: var(--panel); border-bottom: 1px solid var(--line); }
  .logo { font: 700 15px var(--mono); color: var(--accent); letter-spacing: 1px; }
  .file { font-family: var(--mono); color: var(--dim); }
  .grow { flex: 1; }
  .pill { padding: 2px 9px; border-radius: 99px; font: 600 11px var(--mono); background: var(--panel2); color: var(--dim); }
  .pill.ok { color: var(--ok); } .pill.bad { color: var(--bad); }
  label { display: flex; gap: 6px; align-items: center; color: var(--dim); cursor: pointer; user-select: none; }
  #list { grid-area: list; background: var(--panel); border-right: 1px solid var(--line); overflow: auto; padding: 6px; }
  .sect { font: 600 10px var(--mono); text-transform: uppercase; letter-spacing: 1px; color: var(--dim); margin: 12px 6px 4px; }
  .row { display: flex; align-items: center; gap: 8px; padding: 4px 6px; border-radius: 6px; cursor: pointer; }
  .row:hover { background: var(--panel2); } .row.sel { background: #3a3150; }
  .row img { width: 40px; height: 40px; border-radius: 4px; flex: none; background: #0d0c12; }
  .row .nm { font: 12px var(--mono); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dot { width: 7px; height: 7px; border-radius: 9px; } .dot.err { background: var(--bad); } .dot.new { background: var(--accent); animation: fade 2.5s forwards; }
  @keyframes fade { to { opacity: 0; } }
  main { grid-area: main; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  #stage { flex: 1; display: grid; place-items: center; background: #0d0c12; cursor: grab; position: relative; overflow: hidden; }
  #stage:active { cursor: grabbing; }
  #view { max-width: 100%; max-height: 100%; user-select: none; -webkit-user-drag: none; }
  #err { position: absolute; left: 16px; right: 16px; bottom: 16px; display: none; padding: 12px 14px; border-radius: 8px; background: #2b1720ee; border: 1px solid var(--bad); color: #ffd3d8; font: 12px/1.5 var(--mono); white-space: pre-wrap; }
  #hint { position: absolute; left: 12px; top: 10px; font: 11px var(--mono); color: var(--dim); }
  #bar { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: var(--panel); border-top: 1px solid var(--line); }
  #bar button, #bar a { background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; cursor: pointer; font: 12px var(--mono); text-decoration: none; }
  #slider { flex: 1; accent-color: var(--accent); }
  #info { padding: 6px 12px 9px; background: var(--panel); font: 12px var(--mono); color: var(--dim); }
  #side { grid-area: side; background: var(--panel); border-left: 1px solid var(--line); overflow: auto; }
  #side h3 { margin: 12px 12px 6px; font: 600 10px var(--mono); text-transform: uppercase; letter-spacing: 1px; color: var(--dim); }
  #steps { list-style: none; margin: 0; padding: 0 6px; font: 11px var(--mono); }
  #steps li { padding: 3px 6px; border-radius: 4px; cursor: pointer; display: flex; gap: 6px; }
  #steps li:hover { background: var(--panel2); } #steps li.cur { background: #3a3150; color: var(--accent); }
  #steps .i { color: var(--dim); min-width: 22px; text-align: right; }
</style>
</head>
<body>
<header><span class="logo">KILN</span><span class="file" id="file"></span><span class="grow"></span>
  <label><input type="checkbox" id="spin"> turntable</label><span class="pill" id="status">connecting</span></header>
<aside id="list"></aside>
<main>
  <div id="stage"><img id="view" alt="" draggable="false"><div id="hint">drag to orbit</div><div id="err"></div></div>
  <div id="bar"><button id="play">▶ steps</button><input type="range" id="slider" min="0" max="0" value="0"><span class="file" id="count"></span><a id="dl" href="#">⬇ GLB</a></div>
  <div id="info"></div>
</main>
<aside id="side"><h3>Build steps</h3><ul id="steps"></ul></aside>
<script src="/app.js"></script>
</body>
</html>
